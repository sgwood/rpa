name: Bug report
description: 报告可复现的问题（请勿包含敏感数据）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除提示词、会话内容、令牌、Webhook、个人路径和企业源码。安全漏洞请使用 Security 页面的私密报告入口。
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows Native
        - Windows WSL
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI 工具
      options:
        - Codex
        - Claude
        - Cursor
        - Antigravity IDE
        - Console / shared infrastructure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 0.1.0 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 可粘贴脱敏日志、状态或截图说明。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue。
          required: true
        - label: 我确认内容中不包含密钥、Webhook、提示词、聊天内容或私有源码。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
