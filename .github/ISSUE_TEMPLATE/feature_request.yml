name: Feature request
description: 提议新功能、适配器或体验改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景，不要只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 状态与证据边界
      description: 需要哪些 Hook、CLI 或 SDK？哪些能力只能降级实现？
  - type: textarea
    id: platforms
    attributes:
      label: 平台影响
      description: macOS、Windows Native、WSL 和未来移动端分别有什么影响？
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 提案不要求公开或默认采集提示词、聊天内容、令牌或企业源码。
          required: true
